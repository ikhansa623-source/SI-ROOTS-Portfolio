

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="badgeGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2b33"/>
      <stop offset="100%" stop-color="#2d4a52"/>
    </linearGradient>
  </defs>

  <!-- Smaller badge with golden border -->
  <rect x="4" y="20" width="150" height="150" rx="40" 
